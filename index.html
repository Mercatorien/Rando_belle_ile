<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rando - Belle-Île</title>
    
    <!-- Lien vers le manifeste PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078A8">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app-container">
        <div id="map">
            <button id="btn-geoloc" class="btn-large">📍 Ma Position</button>
            <a href="journal.html" class="btn-journal">📖 Journal</a>
            <div id="offtrack-alert" class="hidden">⚠️ Hors sentier</div>
            <div id="live-stats" class="hidden">
                <div class="stat"><span class="stat-val" id="st-alt">–</span><span class="stat-lbl">alt. (m)</span></div>
                <div class="stat"><span class="stat-val" id="st-done">–</span><span class="stat-lbl">parcouru (km)</span></div>
                <div class="stat"><span class="stat-val" id="st-left">–</span><span class="stat-lbl">restant (km)</span></div>
                <div class="stat"><span class="stat-val" id="st-dplus">–</span><span class="stat-lbl">D+ restant (m)</span></div>
                <div class="stat"><span class="stat-val" id="st-pct">–</span><span class="stat-lbl">% parcours</span></div>
            </div>
        </div>
        <div id="topo-container">
            <canvas id="topo-chart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="app.js"></script>
    
    <!-- Enregistrement du Service Worker pour la PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Service Worker enregistré avec succès."))
            .catch(err => console.error("Erreur Service Worker :", err));
        }
    </script>
</body>
</html>
